[package]
name = "unytctl"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "unytctl"
path = "src/main.rs"

[dependencies]
holochain_client = "0.8"
holo_hash = "0.6"
holochain_types = "0.6"
hc_seed_bundle = "0.6.3"
lair_keystore_api = "0.6.3"

anyhow = "1.0"
base64 = "0.23"
clap = "4.6"
hex = "0.4"
reqwest = { version = "0.13", features = ["json"] }
rpassword = "7.5"
serde = "1.0"
serde_json = { version = "1.0", features = ["preserve_order"] }
serde_yaml = "0.9"
thiserror = "2.0"
tokio = { version = "1.53", features = ["macros", "rt-multi-thread"] }
url = "2.5"
zeroize = "1.9.0"

[profile.release]
strip = true
lto = "fat"
codegen-units = 1
