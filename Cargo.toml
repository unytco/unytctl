[package]
name = "unytctl"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "unytctl"
path = "src/main.rs"

[dependencies]
holochain_client = "0.9.0"
holo_hash = "0.7.0"
hc_seed_bundle = "0.7.1"

anyhow = "1.0"
base64 = "0.23"
clap = "4.6"
rpassword = "7.5"
serde = "1.0"
serde_json = "1.0"
tokio = { version = "1.53", features = ["macros", "rt-multi-thread"] }
zeroize = "1.9.0"
